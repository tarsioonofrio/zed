name: bundle_linux
# Builds the Linux release bundle without the remote server and without Sentry, and without running tests.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: ./script/linux
    - name: Download the WASI SDK
      run: ./script/download-wasi-sdk
    - name: Bundle zed
      run: ./script/bundle-linux --skip-sentry --skip-remote-server
    - name: Show the bundle
      run: |
        ls -l target/release/zed-linux-*.tar.gz
        df -h /
    - uses: actions/upload-artifact@v4
      with:
        name: zed-linux-bundle
        path: target/release/zed-linux-*.tar.gz
        if-no-files-found: error
